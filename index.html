<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pesquisa de Paises</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  </head>
  <body class=" bg-dark text-white">
    <!--Navbar-->
    <nav class="navbar bg-dark">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img src="logo.svg" alt="Bootstrap" width="100" >
          </a>
        </div>
      </nav>
      <!--botão de pesquisa-->
      <h1 class="text-center"><strong>Pesquisa de Países</strong></h1>
      <div class="container input-group mb-3">
        <input type="text" id="pais" class="form-control" placeholder="Digite o nome dos Países" aria-label="Recipient's username" aria-describedby="button-addon2">
        <button onclick="procurar()" class="btn text-white bg-primary" type="button" id="button-addon2">Pesquisar</button>
      </div>
      <!--card com as bandeiras-->
      <div id="card" class="card container p-3 mb-3" style="width: 18rem;">
        <img src="" id="bandeira" class="card-img-top" alt="...">
        <div class="card-body text-dark">
          <h5 class="card-title text-center" id="nome" > <strong>Nome</strong></h5>
        </div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item text-center"><strong>Capital:</strong> <p id="Cap">teste</p></li>
          <li class="list-group-item text-center"><strong>Continente:</strong> <p id="Cont">teste</p></li>
          <li class="list-group-item text-center"><strong>População:</strong> <p id="Pop">teste</p></li>
        </ul>
      

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
